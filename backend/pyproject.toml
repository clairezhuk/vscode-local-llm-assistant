[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "claire.zhuk@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.160.0",
    "llama-cpp-python>=0.3.36",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
